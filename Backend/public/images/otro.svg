  <text x="80" y="155" font-size="22" font-family="Arial">🏈</text>
  <text x="298" y="155" font-size="22" font-family="Arial">🏐</text>
  <!-- Label -->
  <text x="200" y="205" font-family="Arial, sans-serif" font-size="13" fill="#00b4a6" text-anchor="middle" font-weight="bold" opacity="0.8">OTROS DEPORTES</text>
