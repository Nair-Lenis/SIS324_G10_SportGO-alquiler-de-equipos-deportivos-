  <path d="M175,60 L225,60 L220,115 Q210,130 200,130 Q190,130 180,115 Z" fill="#c8960a" opacity="0.9"/>
  <rect x="190" y="128" width="20" height="20" rx="2" fill="#c8960a" opacity="0.8"/>
  <rect x="178" y="145" width="44" height="8" rx="4" fill="#c8960a" opacity="0.8"/>
