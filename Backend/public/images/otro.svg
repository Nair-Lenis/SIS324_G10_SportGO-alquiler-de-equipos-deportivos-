      <stop offset="0%" style="stop-color:#110d1f"/>
      <stop offset="100%" style="stop-color:#1a1430"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgOtro)"/>
  <!-- Decorative circles -->
  <circle cx="200" cy="120" r="90" fill="none" stroke="#00b4a6" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="120" r="70" fill="none" stroke="#00b4a6" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="120" r="50" fill="none" stroke="#c06010" stroke-width="1" opacity="0.2"/>
