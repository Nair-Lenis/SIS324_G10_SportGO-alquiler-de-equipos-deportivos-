<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a0f"/>
      <stop offset="100%" style="stop-color:#1a2e1a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4a1e"/>
      <stop offset="100%" style="stop-color:#1a2e10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky3)"/>
  <!-- Hills -->
  <ellipse cx="100" cy="220" rx="180" ry="80" fill="#1e3a12" opacity="0.8"/>
  <ellipse cx="320" cy="230" rx="160" ry="70" fill="#243d15" opacity="0.7"/>
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="60" fill="url(#ground)"/>
  <!-- Trail path -->
  <path d="M50,230 Q130,215 200,220 Q270,225 350,210" fill="none" stroke="#8a6a3a" stroke-width="8" opacity="0.6"/>
  <path d="M50,230 Q130,215 200,220 Q270,225 350,210" fill="none" stroke="#c4a05a" stroke-width="3" opacity="0.4" stroke-dasharray="8,6"/>
  <!-- Trees -->
  <polygon points="60,170 75,120 90,170" fill="#2a5c18"/>
  <polygon points="55,170 75,100 95,170" fill="#336b1e"/>
  <polygon points="290,165 308,110 326,165" fill="#2a5c18"/>
  <polygon points="285,165 308,90 331,165" fill="#336b1e"/>
  <polygon points="350,175 365,130 380,175" fill="#2a5c18"/>
  <!-- Hiker silhouette -->
  <circle cx="200" cy="178" r="11" fill="#4a3520"/>
  <!-- Hat -->
  <ellipse cx="200" cy="169" rx="12" ry="4" fill="#5a4030"/>
  <rect x="194" y="163" width="12" height="7" rx="2" fill="#5a4030"/>
  <!-- Body -->
  <rect x="192" y="188" width="16" height="20" rx="4" fill="#3a5a2a"/>
  <!-- Legs walking -->
  <line x1="196" y1="208" x2="188" y2="228" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
  <line x1="204" y1="208" x2="212" y2="228" stroke="#4a3520" stroke-width="5" stroke-linecap="round"/>
  <!-- Hiking stick -->
  <line x1="215" y1="178" x2="225" y2="228" stroke="#8a6a3a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Backpack -->
  <rect x="206" y="188" width="12" height="16" rx="3" fill="#c04a1a"/>
  <!-- Sun -->
  <circle cx="340" cy="45" r="22" fill="#f5c842" opacity="0.7"/>
  <circle cx="340" cy="45" r="16" fill="#f5d870" opacity="0.9"/>
  <!-- Sun rays -->
  <line x1="340" y1="15" x2="340" y2="8" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
  <line x1="360" y1="25" x2="365" y2="20" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
  <line x1="370" y1="45" x2="378" y2="45" stroke="#f5c842" stroke-width="2" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="252" font-family="Arial, sans-serif" font-size="13" fill="#00b4a6" text-anchor="middle" font-weight="bold" opacity="0.8">TRAIL / SENDERISMO</text>
</svg>
