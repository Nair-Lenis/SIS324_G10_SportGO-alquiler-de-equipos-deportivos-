<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="60%" style="stop-color:#0d2240"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#004466"/>
      <stop offset="100%" style="stop-color:#001a33"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sky)"/>
  <!-- Water -->
  <rect x="0" y="170" width="400" height="90" fill="url(#water)" opacity="0.9"/>
  <!-- Waves -->
  <path d="M0,170 Q50,160 100,170 Q150,180 200,170 Q250,160 300,170 Q350,180 400,170" fill="none" stroke="#00b4a6" stroke-width="2" opacity="0.7"/>
  <path d="M0,185 Q50,175 100,185 Q150,195 200,185 Q250,175 300,185 Q350,195 400,185" fill="none" stroke="#00b4a6" stroke-width="1.5" opacity="0.4"/>
  <!-- Kayak hull -->
  <ellipse cx="200" cy="172" rx="110" ry="14" fill="#e85c1a"/>
  <ellipse cx="200" cy="170" rx="106" ry="10" fill="#ff6b2b"/>
  <!-- Cockpit -->
  <ellipse cx="200" cy="167" rx="30" ry="7" fill="#1a1a2e"/>
  <ellipse cx="200" cy="166" rx="26" ry="5.5" fill="#252540"/>
  <!-- Paddle -->
  <line x1="130" y1="130" x2="270" y2="155" stroke="#c8a96e" stroke-width="5" stroke-linecap="round"/>
  <!-- Paddle blades -->
  <ellipse cx="120" cy="127" rx="22" ry="10" fill="#d4b483" transform="rotate(-20,120,127)"/>
  <ellipse cx="280" cy="157" rx="22" ry="10" fill="#d4b483" transform="rotate(-20,280,157)"/>
  <!-- Paddler silhouette -->
  <circle cx="200" cy="150" r="12" fill="#2d4a6e"/>
  <path d="M193,162 Q200,175 207,162" fill="#2d4a6e"/>
  <!-- Stars/reflections -->
  <circle cx="60" cy="40" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="120" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="300" cy="35" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="350" cy="55" r="1" fill="white" opacity="0.5"/>
  <circle cx="80" cy="70" r="1" fill="white" opacity="0.4"/>
  <!-- Water reflection -->
  <path d="M100,195 Q200,190 300,195" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
  <!-- Label -->
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="13" fill="#00b4a6" text-anchor="middle" font-weight="bold" opacity="0.8">ACUÁTICO</text>
</svg>
