<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a2332"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4a6"/>
      <stop offset="100%" style="stop-color:#00d4c4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- Mountains bg -->
  <polygon points="0,200 80,80 160,200" fill="#1d2d44" opacity="0.6"/>
  <polygon points="100,200 200,60 300,200" fill="#243447" opacity="0.6"/>
  <polygon points="220,200 330,90 400,200" fill="#1a2d3d" opacity="0.5"/>
  <!-- Ground line -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#00b4a6" stroke-width="1.5" opacity="0.3"/>
  <!-- Bike: rear wheel -->
  <circle cx="140" cy="185" r="42" fill="none" stroke="#00b4a6" stroke-width="3.5"/>
  <circle cx="140" cy="185" r="5" fill="#00b4a6"/>
  <!-- Spokes rear -->
  <line x1="140" y1="143" x2="140" y2="227" stroke="#00b4a6" stroke-width="1.5" opacity="0.5"/>
  <line x1="98" y1="185" x2="182" y2="185" stroke="#00b4a6" stroke-width="1.5" opacity="0.5"/>
  <line x1="110" y1="155" x2="170" y2="215" stroke="#00b4a6" stroke-width="1.5" opacity="0.4"/>
  <line x1="110" y1="215" x2="170" y2="155" stroke="#00b4a6" stroke-width="1.5" opacity="0.4"/>
  <!-- Bike: front wheel -->
  <circle cx="270" cy="185" r="42" fill="none" stroke="#00b4a6" stroke-width="3.5"/>
  <circle cx="270" cy="185" r="5" fill="#00b4a6"/>
  <!-- Spokes front -->
  <line x1="270" y1="143" x2="270" y2="227" stroke="#00b4a6" stroke-width="1.5" opacity="0.5"/>
  <line x1="228" y1="185" x2="312" y2="185" stroke="#00b4a6" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="155" x2="300" y2="215" stroke="#00b4a6" stroke-width="1.5" opacity="0.4"/>
  <line x1="240" y1="215" x2="300" y2="155" stroke="#00b4a6" stroke-width="1.5" opacity="0.4"/>
  <!-- Frame -->
  <line x1="140" y1="185" x2="195" y2="135" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="135" x2="270" y2="185" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="135" x2="225" y2="185" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="140" y1="185" x2="225" y2="185" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Seat post -->
  <line x1="215" y1="135" x2="215" y2="110" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="202" y="106" width="26" height="6" rx="3" fill="#e0e0e0"/>
  <!-- Handlebar -->
  <line x1="258" y1="145" x2="258" y2="122" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="248" y1="118" x2="275" y2="118" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>
  <!-- Chain ring -->
  <circle cx="185" cy="185" r="14" fill="none" stroke="#c0c0c0" stroke-width="2.5"/>
  <!-- Label -->
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="13" fill="#00b4a6" text-anchor="middle" font-weight="bold" opacity="0.8">CICLISMO</text>
</svg>
